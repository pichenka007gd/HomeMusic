# Contributor License Agreement (CONTRIBUTING.md, section "CLA"): a pull request's authors sign it with a comment.
# Signatures are kept in the `cla-signatures` branch, outside master (master is replaced by published snapshots).
# The job never checks out or runs the pull request's code, so `pull_request_target` is safe here.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # v2.6.1, pinned by commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/justman-1/HomeMusic-public/blob/master/CONTRIBUTING.md#cla
          branch: cla-signatures
          allowlist: justman-1,dependabot[bot],github-actions[bot]
          create-file-commit-message: 'CLA: create the signatures file'
          signed-commit-message: 'CLA: $contributorName signed in #$pullRequestNo'
          custom-notsigned-prcomment: >-
            Спасибо за PR! Чтобы его можно было принять, прочитайте, пожалуйста,
            [соглашение участника (CLA)](https://github.com/justman-1/HomeMusic-public/blob/master/CONTRIBUTING.md#cla) и подпишите его: оставьте в этом PR комментарий
            с фразой ниже. Подписать нужно один раз, подпись действует для всех ваших PR.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Все авторы этого PR подписали соглашение участника (CLA). Спасибо!
