// Build inputs can override the public HomeMusic deployment without changing saved servers.
def homemusicProperties = new Properties()
def homemusicPropertiesFile = rootProject.file('homemusic.properties')
if (homemusicPropertiesFile.exists()) {
    homemusicPropertiesFile.withInputStream { homemusicProperties.load(it) }
}
def homemusicUrl = { String gradleProperty, String localProperty, String fallback ->
    def value = providers.gradleProperty(gradleProperty)
            .getOrElse(homemusicProperties.getProperty(localProperty, fallback)).trim()
    groovy.json.JsonOutput.toJson(value)
}

// HomeMusic release signing: credentials live in the git-ignored keystore.properties
// (storeFile, storePassword, keyAlias, keyPassword). Without it the release APK is left unsigned.
def homemusicKeystoreProperties = new Properties()
def homemusicKeystoreFile = rootProject.file('keystore.properties')
if (homemusicKeystoreFile.exists()) {
    homemusicKeystoreFile.withInputStream { homemusicKeystoreProperties.load(it) }
}

android {
    namespace = 'com.eddyizm.tempus'
    //noinspection GradleDependency
    compileSdk = 37
    buildToolsVersion = '36.1.0'

    defaultConfig {
        minSdkVersion 24
        //noinspection OldTargetApi
        targetSdk = 37

        versionCode 50
        versionName '4.29.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // HomeMusic integration (Hub tabs, share target, notifications, updates) is off by default.
        buildConfigField 'boolean', 'HOMEMUSIC', 'false'
        buildConfigField 'String', 'HUB_URL', '""'
        buildConfigField 'String', 'HUB_LOCAL_URL', '""'
        buildConfigField 'String', 'MUSIC_URL', '""'
        buildConfigField 'String', 'MUSIC_LOCAL_URL', '""'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"   : "true"
                ]
                // The schema directory goes in as a relocatable input (see RoomSchemaArgs at the end of the file): an absolute
                // path in the plain argument made the javac cache key differ per checkout and defeated the Gradle build cache.
                compilerArgumentProviders(new RoomSchemaArgs(project.file("schemas")))
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    splits {
        abi {
            enable = true
            reset()
            //noinspection ChromeOsAbiSupport
            universalApk = true
        }
    }

    packaging {
        // DEX stored uncompressed: the release patches (scripts/release-android.ps1) diff raw bytecode, so an update that
        // changes a little ships about 1.2-1.8 MB instead of 3.7 MB (the full APK is 3.6 MB larger).
        dex {
            useLegacyPackaging = false
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    signingConfigs {
        if (homemusicKeystoreFile.exists()) {
            homemusic {
                storeFile = rootProject.file(homemusicKeystoreProperties['storeFile'])
                storePassword = homemusicKeystoreProperties['storePassword']
                keyAlias = homemusicKeystoreProperties['keyAlias']
                keyPassword = homemusicKeystoreProperties['keyPassword']
            }
        }
    }

    flavorDimensions += "default"

    productFlavors {
        tempus {
            dimension = "default"
            applicationId = 'com.eddyizm.tempus'
        }

        degoogled {
            dimension = "default"
            applicationId = "com.eddyizm.degoogled.tempus"
        }

        // HomeMusic fork: degoogled base (no Google services) + Hub integration.
        homemusic {
            dimension = "default"
            applicationId = "app.homemusic.selfhost"
            // Own version line; -PhmVersionCode / -PhmVersionName override it for test builds.
            versionCode Integer.parseInt((project.findProperty('hmVersionCode') ?: '1').toString())
            versionName((project.findProperty('hmVersionName') ?: '1.0.0').toString())
            buildConfigField 'boolean', 'HOMEMUSIC', 'true'
            buildConfigField 'String', 'HUB_URL', homemusicUrl('hmHubUrl', 'hubUrl', 'https://music.pichenka007gd.ru')
            buildConfigField 'String', 'HUB_LOCAL_URL', homemusicUrl('hmHubLocalUrl', 'hubLocalUrl', '')
            // The music server (Navidrome) the sign-in screen offers, and its home address
            buildConfigField 'String', 'MUSIC_URL', homemusicUrl('hmMusicUrl', 'musicUrl', 'https://hub.pichenka007gd.ru')
            buildConfigField 'String', 'MUSIC_LOCAL_URL', homemusicUrl('hmMusicLocalUrl', 'musicLocalUrl', '')
            if (homemusicKeystoreFile.exists()) {
                signingConfig = signingConfigs.homemusic
            }
        }
    }

    buildTypes {
        release {
            shrinkResources = true
            minifyEnabled = true
            debuggable = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix = ".debug"
            debuggable = true
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }

    lint {
        baseline = file("lint-baseline.xml")
        disable += "MissingTranslation"
    }
}

